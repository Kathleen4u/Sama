<!-- Invest Modal — content is built by investments.js from the product data below -->
<div class="inv-modal" id="investModal" aria-hidden="true">
    <div class="inv-modal-overlay" onclick="closeInvestModal('investModal')"></div>
    <div class="inv-modal-content" role="dialog" aria-modal="true" aria-labelledby="investModalTitle">
        <button class="inv-modal-close" onclick="closeInvestModal('investModal')" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>

        <h2 class="inv-modal-title" id="investModalTitle"></h2>
        <p class="inv-modal-sub" id="investModalDescription"></p>

        <div class="inv-alert" id="investAlert"></div>

        <form id="investForm" class="inv-form" novalidate>
            <!-- Managed portfolio: basket choice -->
            <div class="inv-field" id="investPortfolioField">
                <label class="inv-label">Choose a strategy</label>
                <div class="inv-options inv-options-stack" id="investPortfolioOptions"></div>
            </div>

            <!-- Fixed term: term choice -->
            <div class="inv-field" id="investTermField">
                <label class="inv-label">Choose a term</label>
                <div class="inv-options" id="investTermOptions"></div>
            </div>

            <!-- Savings: rate + existing balance note -->
            <div class="inv-field" id="investSavingsInfo">
                <div class="inv-info-row">
                    <span>Interest rate</span><strong id="investSavingsRate"></strong>
                </div>
                <div class="inv-note" id="investTopUpNote"></div>
            </div>

            <div class="inv-field">
                <label class="inv-label" for="investAmount">Amount (USD)</label>
                <div class="inv-amount-wrap">
                    <span class="inv-amount-prefix">$</span>
                    <input type="number" class="inv-input" id="investAmount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
                    <button type="button" class="inv-max-btn" onclick="setInvestMax()">Max</button>
                </div>
                <div class="inv-hint">
                    <span id="investMinHint"></span>
                    <span>Available: <strong>${{ "{:,.2f}".format(wallet.balance) }}</strong></span>
                </div>
            </div>

            <div class="inv-projection" id="investProjection"></div>

            <p class="inv-disclaimer" id="investDisclaimer"></p>

            <button type="submit" class="inv-submit" id="investSubmitBtn">Invest</button>
        </form>
    </div>
</div>

<!-- Withdraw / Exit / Sell Modal -->
<div class="inv-modal" id="investWithdrawModal" aria-hidden="true">
    <div class="inv-modal-overlay" onclick="closeInvestModal('investWithdrawModal')"></div>
    <div class="inv-modal-content" role="dialog" aria-modal="true" aria-labelledby="investWithdrawTitle">
        <button class="inv-modal-close" onclick="closeInvestModal('investWithdrawModal')" aria-label="Close">
            <i class="fas fa-times"></i>
        </button>

        <h2 class="inv-modal-title" id="investWithdrawTitle"></h2>
        <div class="inv-alert" id="investWithdrawAlert"></div>

        <form id="investWithdrawForm" class="inv-form" novalidate>
            <div class="inv-withdraw-body" id="investWithdrawBody"></div>

            <div class="inv-field" id="investWithdrawAmountField">
                <label class="inv-label" for="investWithdrawAmount">Amount to withdraw (USD)</label>
                <div class="inv-amount-wrap">
                    <span class="inv-amount-prefix">$</span>
                    <input type="number" class="inv-input" id="investWithdrawAmount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
                    <button type="button" class="inv-max-btn" onclick="setWithdrawMax()">Max</button>
                </div>
            </div>

            <button type="submit" class="inv-submit" id="investWithdrawBtn">Confirm</button>
        </form>
    </div>
</div>

<script>
    window.INVEST_DATA = {
        products: {{ products | tojson }},
        positions: {{ investments.positions | tojson }},
        walletBalance: {{ wallet.balance | float }}
    };
</script>
<script src="{{ url_for('static', filename='js/investments.js') }}"></script>
