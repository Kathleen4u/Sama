{% block extra_css %}
<link rel="stylesheet" href="../../../../static/css/dashboard/components/settings-password.css">{% endblock %}


<!-- Password Tab Content -->
<div class="password-section">
    <form action="{{ url_for('auth.change_password') }}" method="post">
        <div class="password-grid">
            <!-- Change Password Section -->
            <div class="password-card">
                <h3 class="card-title">Change Password</h3>
                <p class="card-description">To keep your account secure, please update your password below.</p>

                <div class="form-group">
                    <label class="form-label">Old password</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-input" id="oldPassword" name="old_password"
                            placeholder="Old password">
                        <button type="button" class="toggle-password" onclick="togglePassword('oldPassword')">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">New password</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-input" id="newPassword" name="new_password"
                            placeholder="New password">
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm new password</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-input" id="confirmPassword" name="confirm_password"
                            placeholder="Confirm new password">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                {# Button lives inside the card so it naturally aligns with the form fields #}
                <div class="submit-btn-container">
                    <button type="submit" class="submit-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const button = input.nextElementSibling;
        const icon = button.querySelector('i');

        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    }
</script>
