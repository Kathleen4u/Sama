{% block extra_css %}<link rel="stylesheet" href="../../../../static/css/dashboard/components/price-chart.css">{% endblock %}

<!-- Price Chart -->
<div class="price-chart-container">
    <div class="chart-header">
        <h3 class="chart-title">Price Chart</h3>
        <div class="chart-timeframes">
            <button class="timeframe-btn active" onclick="changeTimeframe('1D', this)">1D</button>
            <button class="timeframe-btn" onclick="changeTimeframe('5D', this)">5D</button>
            <button class="timeframe-btn" onclick="changeTimeframe('1M', this)">1M</button>
            <button class="timeframe-btn" onclick="changeTimeframe('6M', this)">6M</button>
            <button class="timeframe-btn" onclick="changeTimeframe('1Y', this)">1Y</button>
            <button class="timeframe-btn" onclick="changeTimeframe('5Y', this)">5Y</button>
            <button class="timeframe-btn" onclick="changeTimeframe('Max', this)">Max</button>
        </div>
    </div>
    <div class="chart-canvas">
        <canvas id="priceChart" width="600" height="300"></canvas>
    </div>
</div>
{% block extra_js %}
<script src="../../../../static/js/price-chart.js"></script>
{% endblock %}
